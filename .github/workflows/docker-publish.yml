name: Publicar imagem no Docker Hub e fazer deploy no Azure

on:
  push:
    branches:
      - main
      - master

jobs:
  build-e-push:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Fazer login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e enviar a imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest

      - name: Fazer deploy no Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: gabrielgelde/todo-app
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: gabrielgelde/todo-app:latest
